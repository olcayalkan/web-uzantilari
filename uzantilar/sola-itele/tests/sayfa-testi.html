<!doctype html>
<!--
  content.js davranış testi. 1000px genişlikte açılmalıdır (tests/calistir.sh böyle açar).
  Sonuç sayfa başlığına yazılır: "GEÇTİ" ya da "KALDI: ...".
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 16px sans-serif; background: #eef; }
  #ust { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #c33; }            /* tam genişlik üst şerit */
  #sohbet { position: fixed; bottom: 20px; right: 20px; width: 120px; height: 120px; background: #3a3; } /* sağa dayalı */
  #pencere { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); width: 400px; height: 100px; background: #33c; } /* ortalanmış */
  #mutlak { position: absolute; top: 60px; right: 0; width: 100px; height: 40px; background: #fa0; } /* absolute, sağ kenar */
  main { padding: 70px 20px; }
</style>
</head>
<body>
<div id="ust"></div><div id="sohbet"></div><div id="pencere"></div><div id="mutlak"></div>
<main><p>İçerik metni korunuyor mu? Lorem ipsum dolor sit amet.</p></main>

<!-- chrome.storage taklidi: %70 ile açık başlar, değişiklik bildirimi window.__bildir ile tetiklenir -->
<script>
  window.chrome = { storage: {
    local: { get: () => Promise.resolve({ acik: true, oran: 0.7 }) },
    onChanged: { addListener(f) { window.__bildir = f; } },
  } };
</script>
<script src="../src/core/sabitler.js"></script>
<script src="../src/features/itele/domain/itele_motoru.js"></script>
<script src="../src/features/itele/data/depolama.js"></script>
<script src="../src/features/itele/presentation/content/content.js"></script>
<script>
  const kutu = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return [Math.round(r.left), Math.round(r.right)]; };
  const olc = () => ({ html: Math.round(document.documentElement.getBoundingClientRect().width), ust: kutu('ust'), sohbet: kutu('sohbet'), pencere: kutu('pencere'), mutlak: kutu('mutlak') });

  // Beklenen değerler 1000px pencere içindir.
  const beklenen = {
    '%70': { html: 700, ust: [0, 700], sohbet: [560, 680], pencere: [150, 550], mutlak: [600, 700] },
    '%80': { html: 800, ust: [0, 800], sohbet: [660, 780], pencere: [200, 600], mutlak: [700, 800] },
    'kapalı': { html: 1000, ust: [0, 1000], sohbet: [860, 980], pencere: [300, 700], mutlak: [900, 1000] },
  };
  const sonuc = {};
  const bekle = (ms) => new Promise((r) => setTimeout(r, ms));

  (async () => {
    await bekle(600);
    sonuc['%70'] = olc();
    window.__bildir({ oran: { newValue: 0.8 } }, 'local');
    await bekle(600);
    sonuc['%80'] = olc();
    window.__bildir({ acik: { newValue: false } }, 'local');
    await bekle(600);
    sonuc['kapalı'] = olc();

    if (innerWidth !== 1000) { document.title = `KALDI: pencere ${innerWidth}px, 1000px olmalı`; return; }
    const hatalar = Object.keys(beklenen)
      .filter((d) => JSON.stringify(sonuc[d]) !== JSON.stringify(beklenen[d]))
      .map((d) => `${d} beklenen ${JSON.stringify(beklenen[d])} gelen ${JSON.stringify(sonuc[d])}`);
    document.title = hatalar.length ? `KALDI: ${hatalar.join(' | ')}` : 'GEÇTİ';
  })();
</script>
</body>
</html>
